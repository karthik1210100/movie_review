inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/migrate/*acts_as_taggable_on*"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "storage/**/*"
    - "config/**/*" # generated boilerplate; reviewed separately

# House style: readability over dogma.
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Layout/LineLength:
  Max: 120
  Exclude:
    - "db/seeds.rb" # tabular seed data reads better on single lines

# Seed scripts are naturally long, linear data loaders.
Metrics/BlockLength:
  Exclude:
    - "db/seeds.rb"

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 25

# RSpec: keep the existing spec structure pragmatic.
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false
